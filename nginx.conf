server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # This file is a template. AUTH_ORIGIN / IDP_ORIGINS / SCRIPT_HASH are
  # substituted when the container starts, by
  # docker-entrypoint.d/05-render-config.sh, from the workload's environment.
  # Nothing here is fixed at image build time.

  # nginx builds redirects from its own listen port, so behind an ingress a
  # 301 would point the browser at :8080. Relative redirects can't leak it.
  absolute_redirect off;

  # The plugin registry, same origin so a remote entry it names is covered
  # by `script-src 'self'`. The entrypoint chooses the proxy snippet when
  # REGISTRY_UPSTREAM is set and the empty-list snippet otherwise.
  include /etc/nginx/conf.d/plugin-registry.conf;

  location = /healthz {
    access_log off;
    return 204;
  }

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/manifest+json
    application/wasm
    application/xml
    application/xml+rss
    image/svg+xml;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    # --- BEGIN security headers (keep in sync with location /) ---
    # `style-src 'unsafe-inline'` is deliberate: routes use inline `style=` attrs.
    # `script-src` carries the hash of the inlined theme-init script (computed
    # at build time, see vite.config.ts); without it `default-src` blocks the
    # script and dark-theme users get the light flash it exists to prevent.
    # `font-src data:` is required because Vite inlines sub-4KB font subsets.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self' '__SCRIPT_HASH__'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'__AUTH_ORIGIN__; form-action 'self'__AUTH_ORIGIN__ __IDP_ORIGINS__; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # --- END security headers ---
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    # --- BEGIN security headers (keep in sync with location /assets/) ---
    # `style-src 'unsafe-inline'` is deliberate: routes use inline `style=` attrs.
    # `script-src` carries the hash of the inlined theme-init script (computed
    # at build time, see vite.config.ts); without it `default-src` blocks the
    # script and dark-theme users get the light flash it exists to prevent.
    # `font-src data:` is required because Vite inlines sub-4KB font subsets.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self' '__SCRIPT_HASH__'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'__AUTH_ORIGIN__; form-action 'self'__AUTH_ORIGIN__ __IDP_ORIGINS__; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # --- END security headers ---
    # No `$uri/`: a directory in the doc root whose name matches a route
    # shadows it -- the directory match 301s to add a trailing slash and
    # then 403s, because autoindex is off, instead of falling through to
    # the SPA. Nothing here is served by directory listing, so the SPA
    # fallback is the only correct second choice.
    try_files $uri /index.html;
  }
}
