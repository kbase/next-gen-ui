name: Design system package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: design-system-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build design-system library
        run: npm run build:design-system

      - name: Pack tarball
        working-directory: dist-design-system
        run: npm pack

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: design-system-tarball
          path: dist-design-system/*.tgz
          if-no-files-found: error

  # The design system as a pip package: a hatchling hook compiles
  # components/*/<Name>.module.scss into the wheel with the Dart Sass pip can install.
  python-wheel:
    name: Python wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs reads the ds-v* tags for the version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install build dart-sass

      - name: Build the wheel
        working-directory: src/design-system
        run: python -m build --wheel --outdir dist-python .

      # Catches a .module.scss using a Sass feature newer than the 1.51.0 pip ships, which
      # otherwise shows up as a portal that renders slightly differently from the showcase.
      - name: The two compilers agree
        working-directory: src/design-system
        run: python python/check_compiler_parity.py --sass ../../node_modules/.bin/sass

      # force-include ignores exclude, so a directory added to it brings every file under it into
      # the wheel.
      - name: The wheel holds the sheets, the adapter, the loader and the guide
        working-directory: src/design-system
        run: |
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist-python/*.whl")[0]).namelist()
          shipped = [n for n in names if not n.startswith("kbase_design_system-")]
          # js is the Loader's exit, which gen_loader_js.py says cannot be a stylesheet. md is the
          # migration guide.
          stray = [n for n in shipped if n.rsplit(".", 1)[-1] not in ("css", "py", "js", "md")]
          assert not stray, f"force-include swept these into the installed package: {stray}"
          scripts = [n for n in shipped if n.endswith(".js")]
          assert scripts == ["kbase_design_system/solara/loader.js"], f"unexpected scripts: {scripts}"
          for want in ("kbase_design_system/components.css",
                       "kbase_design_system/chrome.css",
                       "kbase_design_system/tokens.css",
                       "kbase_design_system/solara/vuetify.css",
                       "kbase_design_system/solara/icons.py",
                       "kbase_design_system/solara/loader.js"):
              assert want in shipped, f"missing from the wheel: {want}"
          print(f"{len(shipped)} files:", *sorted(shipped), sep="\n  ")
          EOF

      # Nothing else looks at what the generator produced. An unprefixed class ships into eight
      # portals and collides with whatever they already call `.root`; a missing chunk is a
      # component that silently lost its styling.
      - name: components.css is what the naming rule says it is
        working-directory: src/design-system
        run: |
          python - <<'EOF'
          import glob, re, zipfile, pathlib
          css = zipfile.ZipFile(glob.glob("dist-python/*.whl")[0]).read(
              "kbase_design_system/components.css").decode()
          body = re.sub(r"/\*.*?\*/", "", css, flags=re.S)
          stray = sorted({c for c in re.findall(r"\.([A-Za-z_][\w-]*)", body)
                          if not c.startswith("kb-")})
          assert not stray, f"classes without the kb- prefix: {stray}"
          # @charset is only valid as the first bytes of a file, and Dart Sass emits one per module
          # that holds a non-ASCII byte.
          assert "@charset" not in css, "@charset survived into the concatenated sheet"
          chunks = css.count("/* --- ")
          modules = len([p for p in pathlib.Path("components").glob("*/*.module.scss")
                         if p.name == f"{p.parent.name}.module.scss"])
          assert chunks == modules, f"{chunks} chunks for {modules} stylesheets"
          print(f"{chunks} components, {len(stray) == 0 and 'all classes prefixed'}")
          EOF

      # The payload is force-included files with no package directory behind them, so nothing
      # above imports it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: The adapter imports from the built wheel, on the oldest supported Python
        working-directory: src/design-system
        run: |
          python -m venv /tmp/probe
          /tmp/probe/bin/pip install -q dist-python/*.whl
          /tmp/probe/bin/python -c "
          from importlib.resources import files
          from kbase_design_system.solara import icons, theme
          assert (files('kbase_design_system') / 'components.css').read_text()
          # Neither this package nor its solara subpackage carries an __init__.py.
          assert (files('kbase_design_system.solara') / 'vuetify.css').read_text()
          assert 'kb-loader--loader' in icons.loader(32)
          assert theme.vuetify()['light']['primary'] == '#007dc3'
          print('adapter ok')"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: design-system-wheel
          path: src/design-system/dist-python/*.whl
          if-no-files-found: error

  publish:
    name: Publish to GHCR npm
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'ds-v')
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kbase'

      - run: npm ci

      - name: Derive package version from release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^ds-v(.+)$ ]]; then
            echo "Release tag '$RELEASE_TAG' is not of the form 'ds-vX.Y.Z'." >&2
            exit 1
          fi
          echo "DS_VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"

      - name: Build design-system library
        run: npm run build:design-system

      - name: Pack tarball
        working-directory: dist-design-system
        run: npm pack

      - name: Publish to GHCR npm
        working-directory: dist-design-system
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish "kbase-design-system-${DS_VERSION}.tgz"

      - name: Attach tarball to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" dist-design-system/*.tgz --clobber
